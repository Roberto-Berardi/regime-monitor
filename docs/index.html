<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Roberto Berardi — Cross-Asset Regime Monitor</title>
<style>
  body{margin:0;min-height:100vh;display:grid;place-items:center;
       background:#0D3B4F;color:#fff;text-align:center;
       font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Inter,sans-serif}
  .box{padding:40px}
  h1{font-size:34px;letter-spacing:-.03em;margin:0 0 10px;font-weight:800}
  p{color:rgba(255,255,255,.7);font-size:15px;margin:0}
  .dot{display:inline-block;width:8px;height:8px;border-radius:50%;
       background:#E8A33D;margin-right:8px;vertical-align:middle}
</style>
</head>
<body>
  <div class="box">
    <h1>Cross-Asset Regime Monitor</h1>
    <p><span class="dot"></span>Deployment in progress — live shortly.</p>
  </div>
</body>
</html>
