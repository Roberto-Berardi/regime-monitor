name: Daily refresh

on:
  schedule:
    - cron: '15 6 * * 1-5'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          token: ${{ secrets.PAT_TOKEN }}

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run pipeline
        env:
          FRED_API_KEY: ${{ secrets.FRED_API_KEY }}
        run: python precompute_rotation.py

      - name: Validate artifacts
        run: python scripts/check_rotation.py

      - name: Build the page
        run: python scripts/build_site.py

      - name: Commit refreshed artifacts and page
        run: |
          git config user.name  "regime-monitor bot"
          git config user.email "actions@github.com"
          git add data/rotation/ docs/
          if git diff --staged --quiet; then
            echo "No changes to commit."
          else
            git commit -m "Data refresh $(date -u +'%Y-%m-%d')"
            git push
            echo "Artifacts and page committed."
          fi

      - name: Ping the dead man's switch
        if: success()
        run: curl -fsS -m 10 --retry 3 "${{ secrets.HEALTHCHECK_URL }}" || true
