name: Check secrets

on:
  workflow_dispatch:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - name: Verify secrets are present
        env:
          FRED_API_KEY: ${{ secrets.FRED_API_KEY }}
          PAT_TOKEN: ${{ secrets.PAT_TOKEN }}
        run: |
          fail=0
          if [ -z "$FRED_API_KEY" ]; then
            echo "FRED_API_KEY   MISSING"; fail=1
          else
            echo "FRED_API_KEY   present, ${#FRED_API_KEY} chars"
            [ ${#FRED_API_KEY} -eq 32 ] || { echo "  ^ expected 32 chars"; fail=1; }
          fi
          if [ -z "$PAT_TOKEN" ]; then
            echo "PAT_TOKEN      MISSING"; fail=1
          else
            echo "PAT_TOKEN      present, ${#PAT_TOKEN} chars"
          fi
          exit $fail
